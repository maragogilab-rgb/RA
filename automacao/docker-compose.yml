# n8n + Evolution API (WhatsApp) para a Maragogi Lab.
# Uso: copie .env.example para .env, preencha e rode `docker compose up -d`.
# Guia completo: WHATSAPP-N8N.md

services:
  n8n:
    image: n8nio/n8n:2.48.8
    restart: unless-stopped
    ports:
      - "5678:5678"
    # Permite falar com um ERP rodando no próprio computador (ERP_URL=http://host.docker.internal:3000).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      WEBHOOK_URL: ${N8N_URL:-http://localhost:5678}/
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: America/Maceio
      TZ: America/Maceio
      # O fluxo lê as configurações abaixo com $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      ERP_URL: ${ERP_URL}
      ERP_INTEGRACAO_TOKEN: ${ERP_INTEGRACAO_TOKEN}
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_APIKEY: ${EVOLUTION_APIKEY}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      MENSAGEM_BOAS_VINDAS: ${MENSAGEM_BOAS_VINDAS:-}
    volumes:
      - n8n_data:/home/node/.n8n

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on: [postgres, redis]
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_URL_PUBLICA:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_APIKEY}
      LANGUAGE: pt-BR
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: Maragogi Lab
      CONFIG_SESSION_PHONE_NAME: Chrome
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_SENHA}@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: evolution_maragogi
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_SENHA}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  n8n_data:
  evolution_instances:
  postgres_data:
  redis_data:
