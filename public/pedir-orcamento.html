<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peça seu orçamento</title>
  <meta name="description" content="Fotografia, vídeo e marketing. Peça seu orçamento em 1 minuto e receba a resposta no WhatsApp.">
  <style>
    :root{--fundo:#F5EFE6;--cartao:#fff;--texto:#10222E;--suave:#4E5D66;--destaque:#E4572E;--borda:#DCD3C6}
    @media (prefers-color-scheme:dark){:root{--fundo:#0E1A22;--cartao:#16252F;--texto:#F1ECE4;--suave:#A9B4BA;--borda:#2A3A45}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{max-width:560px;margin:0 auto;padding:32px 16px 48px}
    .logo{max-height:56px;max-width:180px;display:block;margin-bottom:16px}
    h1{font-size:clamp(28px,7vw,40px);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}
    .sub{color:var(--suave);margin:0 0 24px}
    form{background:var(--cartao);border:1px solid var(--borda);border-radius:16px;padding:20px;display:grid;gap:14px}
    label{display:grid;gap:6px;font-weight:600;font-size:15px}
    label small{font-weight:400;color:var(--suave)}
    input,select,textarea{font:inherit;color:inherit;background:var(--fundo);border:1px solid var(--borda);border-radius:10px;padding:12px;width:100%}
    textarea{min-height:96px;resize:vertical}
    button,.zap{font:inherit;font-weight:600;font-size:17px;line-height:1;border:0;border-radius:999px;padding:16px;cursor:pointer;text-align:center;text-decoration:none;display:block}
    button{background:var(--destaque);color:#fff}
    button:disabled{opacity:.6}
    .zap{background:#1F9D55;color:#fff;margin-top:12px}
    .oculto{position:absolute;left:-9999px}
    .erro{color:#C0392B;margin:0}
    .ok{background:var(--cartao);border:1px solid var(--borda);border-radius:16px;padding:24px;text-align:center}
    .provas{display:flex;gap:16px;flex-wrap:wrap;color:var(--suave);font-size:14px;margin:20px 0 0;padding:0;list-style:none}
  </style>
  <script type="module" src="/js/pedir-orcamento.js"></script>
</head>
<body>
  <main>
    <img class="logo" id="logo" alt="" hidden>
    <h1 id="titulo">Peça seu orçamento</h1>
    <p class="sub">Conte o que você precisa. Respondemos no seu WhatsApp, normalmente no mesmo dia.</p>

    <form id="form" novalidate>
      <label>Seu nome <input name="nome" required autocomplete="name" maxlength="120"></label>
      <label>WhatsApp com DDD <input name="telefone" required type="tel" inputmode="tel" autocomplete="tel" placeholder="(82) 99999-9999" maxlength="30"></label>
      <label>Empresa <small>(opcional)</small><input name="empresa" autocomplete="organization" maxlength="120"></label>
      <label>O que você precisa?
        <select name="servico_id" id="servicos"><option value="">Escolha um serviço</option></select>
      </label>
      <label>Para quando? <small>(data do evento ou prazo)</small><input name="quando" maxlength="60" placeholder="Ex.: 15/12, próximo mês…"></label>
      <label>Conte um pouco mais <small>(opcional)</small><textarea name="mensagem" maxlength="1500"></textarea></label>
      <label>E-mail <small>(opcional)</small><input name="email" type="email" autocomplete="email" maxlength="200"></label>
      <input class="oculto" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="erro" id="erro" role="alert"></p>
      <button type="submit" id="enviar">Quero meu orçamento</button>
    </form>

    <div class="ok" id="ok" hidden>
      <h2>Pedido recebido! ✔</h2>
      <p>Vamos te chamar no WhatsApp em breve.</p>
      <a class="zap" id="zap" hidden>Falar agora no WhatsApp</a>
    </div>

    <ul class="provas"><li>✔ Sem compromisso</li><li>✔ Resposta rápida</li><li>✔ Atendimento direto</li></ul>
  </main>
</body>
</html>
